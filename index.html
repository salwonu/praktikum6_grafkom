<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini 3D Scene - Three.js</title>
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="hud"></div>
    <div id="help">
      <b>Kontrol</b><br />
      Mouse: orbit / zoom / pan<br />
      <kbd>Space</kbd> toggle animasi<br />
      <kbd>C</kbd> ganti kamera (Perspective / Orthographic)<br />
      <kbd>L</kbd> animasi arah sinar matahari<br />
      <kbd>G</kbd> tampil/sembunyi Material Gallery<br />
      <kbd>1</kbd>-<kbd>4</kbd> kualitas shadow (512/1024/2048/4096)<br />
      <kbd>Tab</kbd> pilih object<br />
      <kbd>←↑→↓</kbd> geser object (X/Z), <kbd>R</kbd>/<kbd>F</kbd> naik/turun<br />
      <kbd>Q</kbd>/<kbd>E</kbd> putar, <kbd>+</kbd>/<kbd>-</kbd> skala
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
